; ==============================================================================
; PlatformIO Configuration File
; Project: Industrial Predictive Maintenance for DC Motor
; Target: ESP32 DevKit V1 (Embedded) & Native Host (x86_64 Simulation & Tests)
; ==============================================================================

[platformio]
default_envs = esp32dev
description = Industrial Predictive Maintenance for DC Motor with ESP32, TinyML, and Real-Time DSP

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -O2
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
lib_deps = 
    kosme/arduinoFFT @ ^2.0.4
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

[env:native]
platform = native
test_framework = custom
build_flags = 
    -std=c++17
    -O2
    -DNATIVE_BUILD
    -DUNIT_TEST
    -Iinclude
    -Itest/mocks
    -Itest
